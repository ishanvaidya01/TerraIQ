<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraIQ - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1a3d2e;
      --forest-light: #2d5a45;
      --cream: #faf8f5;
      --cream-dark: #f0ebe3;
      --charcoal: #2d2d2d;
      --charcoal-light: #4a4a4a;
      --terracotta: #c4705a;
      --terracotta-light: #d98973;
      --sage: #8fa68e;
      --stone: #9c9588;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Organic background shapes */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(143, 166, 142, 0.12) 0%, transparent 70%);
      border-radius: 60% 40% 55% 45% / 55% 45% 60% 40%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -15%;
      left: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(196, 112, 90, 0.08) 0%, transparent 65%);
      border-radius: 45% 55% 40% 60% / 50% 60% 45% 55%;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      background: white;
      width: 100%;
      max-width: 440px;
      padding: 56px 48px;
      position: relative;
      z-index: 1;
      border: 1px solid var(--cream-dark);
    }

    /* Hand-drawn border effect */
    .login-container::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      right: -8px;
      bottom: -8px;
      border: 1px solid var(--sage);
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
    }

    .logo-section {
      margin-bottom: 40px;
      text-align: left;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: var(--forest);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    /* Slightly irregular shape */
    .logo-icon::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: -3px;
      bottom: -3px;
      border: 1px solid var(--terracotta);
      opacity: 0.4;
      z-index: -1;
    }

    .logo-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--forest);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .logo-section p {
      color: var(--stone);
      font-size: 0.9375rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-of-type {
      margin-bottom: 28px;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--cream-dark);
      border-radius: 0;
      font-size: 0.9375rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: var(--cream);
      color: var(--charcoal);
    }

    .form-input:hover {
      border-color: var(--sage);
      background: white;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--forest);
      background: white;
    }

    .form-input::placeholder {
      color: var(--stone);
      font-weight: 400;
    }

    .login-btn {
      width: 100%;
      padding: 16px 24px;
      background: var(--forest);
      color: white;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--forest-light);
      transition: left 0.35s ease;
      z-index: 0;
    }

    .login-btn:hover::before {
      left: 0;
    }

    .login-btn span {
      position: relative;
      z-index: 1;
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .demo-credentials {
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px dashed var(--cream-dark);
    }

    .demo-credentials h4 {
      font-family: 'Playfair Display', serif;
      font-size: 0.9375rem;
      color: var(--forest);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .credential-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.8125rem;
    }

    .credential-row:last-child {
      margin-bottom: 0;
    }

    .credential-label {
      color: var(--stone);
      min-width: 72px;
    }

    .credential-value {
      font-family: 'JetBrains Mono', monospace;
      color: var(--charcoal);
      background: var(--cream);
      padding: 4px 10px;
      font-size: 0.75rem;
      border: 1px solid var(--cream-dark);
    }

    .error-message {
      background: #fef6f4;
      border-left: 3px solid var(--terracotta);
      color: var(--terracotta);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.8125rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .footer-note {
      margin-top: 32px;
      text-align: center;
      font-size: 0.6875rem;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* Subtle texture overlay */
    .texture-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.015;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      z-index: 2;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 40px 28px;
      }

      .login-container::before {
        display: none;
      }

      .logo-section h1 {
        font-size: 1.625rem;
      }
    }
  </style>
</head>
<body>
  <div class="texture-overlay"></div>

  <div class="login-container">
    <div class="logo-section">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
      </div>
      <h1>TerraIQ</h1>
      <p>Carbon emission forecasting for sustainability teams. Track, predict, and reduce your environmental impact.</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">
        <span>Sign In</span>
      </button>
    </form>

    <div class="demo-credentials">
      <h4>Demo Access</h4>
      <div class="credential-row">
        <span class="credential-label">Username</span>
        <code class="credential-value">admin</code>
      </div>
      <div class="credential-row">
        <span class="credential-label">Password</span>
        <code class="credential-value">admin123</code>
      </div>
    </div>

    <p class="footer-note">Sustainability Intelligence Platform</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      
      if (username === 'admin' && password === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', username);
        window.location.href = 'dashboard.html';
      } else {
        errorDiv.textContent = 'Invalid credentials. Try admin / admin123';
        errorDiv.classList.add('show');
        
        setTimeout(() => {
          errorDiv.classList.remove('show');
        }, 4000);
      }
    });

    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
